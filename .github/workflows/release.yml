name: release

# A tag is a promise, so everything that decides whether the promise holds runs
# again here rather than being trusted from the commit it points at. A release
# runs the workflow as it exists at the tag, so a fix to this file has to land
# before the tag is cut, not after.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is built for a release until what is being released passes. The
  # test workflow runs on every push; this runs it again against the tag,
  # because a tag can point at a commit that was green before its neighbour
  # landed.
  gate:
    name: everything the tag has to pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Python step below builds and runs through uv, the same way the test
      # workflow does. Without this it is not on PATH and the step dies at its
      # first line.
      - uses: astral-sh/setup-uv@v5

      - name: Install tzdata
        run: sudo apt-get update && sudo apt-get install -y tzdata

      - name: Lint
        run: |
          cargo clippy --lib --all-targets --features dev-tools -- -D warnings
          cargo clippy --lib --all-targets --features python -- -D warnings

      - name: Test
        run: |
          cargo test --lib
          cargo test --lib --features python

      - name: The suites that need no session
        env:
          IBX_REGISTRATION_TIMEOUT_MS: "20"
        run: |
          cargo test --test control_plane --test depth_wire_test \
            --test error_edge_concurrency --test hot_loop_lifecycle \
            --test malformed_input --test protocol_vectors --test scenarios
          IBX_ALLOW_SKIP_NO_CREDS=1 cargo test --test ib_paper_compat

      - name: The published surface still resolves
        run: cargo test --test public_surface

      # The Python surface and the checks that hold every published number.
      # Without these a tag can ship past a failure they would have caught.
      - name: The Python suite and the gates
        run: |
          uv venv
          uv pip install maturin pytest ib_async
          .venv/bin/maturin develop
          .venv/bin/pytest tests/python -q
          python scripts/check_status_counts.py
          python scripts/check_module_graph.py
          python scripts/check_orphaned_docs.py

      - name: Documentation builds
        run: cargo doc --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

      - name: The crate would publish
        run: cargo publish --dry-run

  # One wheel per platform and per interpreter a caller runs on. The extension
  # links against the interpreter it was built for, so a wheel built on 3.12
  # will not install on 3.13 — every version `requires-python` claims is built,
  # or the claim is one a caller finds out is untrue at `pip install`. Built
  # from the tag, so what is attached to the release is what the tag says and
  # not what a developer had on their machine.
  wheels:
    name: wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          # Linux builds inside a manylinux container, where the interpreter
          # has to be named; on macOS and Windows it is the one setup-python
          # just put on PATH.
          args: >-
            --release --out dist --interpreter
            ${{ matrix.os == 'ubuntu-latest' && format('python{0}', matrix.python) || 'python' }}
          sccache: "true"

      # A wheel that compiles is not a wheel that loads: an extension can fail
      # to find its runtime only when something tries to import it. Windows
      # included, where that is likeliest.
      - name: The wheel imports what it says it does
        shell: bash
        run: |
          python -m venv /tmp/check
          BIN=/tmp/check/bin
          [ -d "$BIN" ] || BIN=/tmp/check/Scripts
          "$BIN/pip" install --find-links dist --no-index ibx
          "$BIN/python" -c "import ibx; print(ibx.__name__, 'imports')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  # Attached to the release rather than published to an index: pushing to PyPI
  # or crates.io is a decision with a token behind it, and this workflow holds
  # neither.
  attach:
    name: attach the wheels to the release
    needs: wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `gh` learns the repository from a checkout or from GH_REPO, and this
      # job has no checkout. Without it the upload fails looking for one.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber
