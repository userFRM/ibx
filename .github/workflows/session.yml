name: session

# What only a session finds.
#
# Every defect a held-open session has found here was invisible to the offline
# gates, because none of them opens one: a connection that stops answering, a
# stream that stops arriving, a request id that answers once. This runs the
# suites that need a session, against a paper account.
#
# A paper account is the same session. `paper` decides one step of the logon —
# a token conversion and which slot its hash occupies — and after the handshake
# the market-data, trading, historical and security-definition connections are
# the same code sending the same messages to the same servers. What differs is
# that fills are simulated, so nothing here places an order that can fill.
#
# Dormant until IB_USERNAME and IB_PASSWORD are both set as repository secrets.
# Without them the first job says so in an annotation and the rest are skipped,
# which GitHub renders as a green check on a workflow that opened no session —
# so a green tick here is not on its own evidence that a session ran. The
# annotation on the `credentials` job is.

on:
  schedule:
    # An hour into the New York session. Phases that need a market — a resting
    # order, a book, a trade stream — skip outside it, and a day order left
    # resting while the market is shut is cancelled by the venue before a
    # phase can replace it. Run before the open, the suite reports mostly
    # skips and one lost race.
    #
    # This holds the account's only session for about ninety minutes: the
    # venue permits one at a time and refuses a second, and that refusal would
    # read here as a defect.
    - cron: "45 14 * * 1-5"
  workflow_dispatch:

concurrency:
  # Never two of these at once, for the same reason.
  group: session
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A session that goes away mid-run is the one failure this suite cannot
  # diagnose from its own output: the reason lives in the client's log, and at
  # error level the log says a connection closed and never why, nor what the
  # reconnect made of it.
  RUST_LOG: ibx=info

permissions:
  contents: read

jobs:
  credentials:
    name: credentials are available
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: |
          if [ -n "$IB_USERNAME" ] && [ -n "$IB_PASSWORD" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No session was opened: IB_USERNAME and IB_PASSWORD \
            must both be set as repository secrets. The jobs below are skipped, \
            and a green check on this run means only that they did not run."
          fi

  paper_compat:
    name: the paper compatibility suite
    needs: credentials
    if: needs.credentials.outputs.present == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the paper suite against a paper account
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: cargo test --test ib_paper_compat -- --test-threads=1
      # Each of these opens a session of its own, which the account allows one
      # of, so they cannot run beside the suite above or beside each other.
      # Left out of every run, they proved nothing: what they were written to
      # check went unchecked from the day they were written.
      - name: the phases that each need a session to themselves
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: cargo test --test ib_paper_compat -- --ignored --test-threads=1
      # Three suites of their own, in no workflow and in no gate: a reconnect
      # on a cached session, a contract listed outside the United States, and
      # the Rust surface against captured answers. Run nowhere, they proved
      # nothing either.
      - name: reconnect, non-US listings, and the surface against captures
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: |
          cargo test --test farm_reconnect -- --test-threads=1
          cargo test --test non_us_live -- --ignored --test-threads=1
          cargo test --test rust_api_gt -- --test-threads=1

  live_python:
    name: the Python suites that need a session
    needs: [credentials, paper_compat]
    if: needs.credentials.outputs.present == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the extension into the environment under test
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest ib_async
          .venv/bin/maturin develop --release --features python
      - name: Test
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: .venv/bin/pytest tests/python -q

  endurance:
    name: a session held open under load
    needs: [credentials, live_python]
    if: needs.credentials.outputs.present == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the extension into the environment under test
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin
          .venv/bin/maturin develop --release --features python
      - name: Subscribe and withdraw for twenty minutes
        env:
          IB_USERNAME: ${{ secrets.IB_USERNAME }}
          IB_PASSWORD: ${{ secrets.IB_PASSWORD }}
        run: .venv/bin/python scripts/endurance.py --minutes 20
