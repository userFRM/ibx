name: build drift

# The build number this client states at logon is a constant here, and the
# vendor moves theirs every few weeks. Nothing notices, so this does: nightly,
# it compares the two and keeps one issue open while they differ.
#
# It opens an issue rather than a pull request on purpose. What a client states
# at logon decides what the server does with it, and that is a change to make
# deliberately against a paper session, not one to merge unattended overnight.

on:
  schedule:
    # Off-hour, off-minute: the version files are static and there is no
    # reason to ask for them at the top of the hour with everyone else.
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: build-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: announced build vs published build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove the parsing before trusting the comparison
        run: python3 .github/scripts/check_build_drift.py --self-check

      - name: Compare
        id: compare
        run: |
          set +e
          out=$(python3 .github/scripts/check_build_drift.py 2>&1)
          status=$?
          set -e
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "drifted=$([ $status -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          # Drift is the thing being reported, not a failure of the job. Only a
          # check that could not run at all should fail here.
          [ $status -le 1 ]

      - name: Report
        if: steps.compare.outputs.drifted == 'true'
        env:
          REPORT: ${{ steps.compare.outputs.report }}
        run: |
          # Said here rather than filed as an issue: this repository has issues
          # turned off, and the report died on that every night without ever
          # being read. A red nightly run is the notification.
          {
            echo "## The vendor has published a build this repository has not looked at"
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "The constants are \`IB_BUILD\` and \`IB_VERSION\` in \`src/config.rs\`."
            echo
            echo "A stale build is tolerated because the logon marks the client as a"
            echo "rolling-release build, which skips the server's allow-list check. That is"
            echo "one flag between these constants and a refused login, so a new build is"
            echo "worth trying — against a paper session, since what is stated at logon"
            echo "decides what the server does with it."
            echo
            echo "Record the build in \`.github/gateway-build.json\` once it has been"
            echo "looked at, whether or not the constants move."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
