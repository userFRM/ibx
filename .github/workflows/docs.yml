name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build docs/book

      # Building the book is the part that can break and is worth knowing
      # about. Publishing it needs Pages turned on for the repository, and
      # where it is not, every push failed on that rather than on anything in
      # the book. Ask first, and publish only where there is somewhere to
      # publish to.
      - name: Is there a Pages site to publish to
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled for ${{ github.repository }}; the book built and is not being published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs/book/book

    outputs:
      pages: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
