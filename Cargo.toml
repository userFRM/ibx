[package]
name = "ibx"
version = "0.7.1"
edition = "2024"
# The oldest compiler this builds on. Enforced here so it is checked
# rather than claimed: the sources use let-chains and fixed-size slice
# chunking, both of which arrived after the edition did, and the order id
# counter takes a lock the kernel releases on its own.
rust-version = "1.89"
description = "Direct connection engine for Interactive Brokers. No Java gateway required."
license = "AGPL-3.0-only"
repository = "https://github.com/userFRM/ibx"
keywords = ["interactive-brokers", "trading", "fix", "market-data", "brokerage"]
categories = ["api-bindings", "finance", "network-programming"]
# Every binary is named below, because the tools under `src/bin` are for
# developing this library rather than for using it, and a caller who installs
# the crate should not be handed 30 of them.
autobins = false
# What a caller installing this crate needs, and nothing else. The published
# package was 355 files and nine megabytes: notebooks, capture tools, the CI
# gates, the live suites and the engineering notes, none of which a dependency
# has any use for.
exclude = [
    ".github/",
    "docs/",
    "notebooks/",
    "scripts/",
    "tests/",
    "python/ibx/*.so",
]

[lib]
name = "ibx"
crate-type = ["lib", "cdylib"]

[features]
default = []
# The measurement and capture tools under `src/bin`. Off by default: they are
# how this library is developed, not how it is used, and most of them read
# credentials.
dev-tools = []
python = ["pyo3"]
# The asynchronous surface. Off by default: a program that drives this client
# from a thread of its own needs nothing here, and the runtime is a dependency
# it should not pay for.
async = ["dep:tokio"]
# Split out so a test binary can link libpython. `extension-module` tells PyO3
# not to link it, which is right for the wheel and wrong for `cargo test`: the
# harness then fails at link time on every Python symbol, and no Rust-side test
# under this feature has ever run (ibx#381). The wheel build asks for both.
extension-module = ["pyo3/extension-module"]
compat = []

[[example]]
name = "hello_session_async"
required-features = ["async"]

